name: Reusable Linux Workflow

on:
  workflow_call:
    inputs:
      task:
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        if: ${{ inputs.task == 'rust_tests' || inputs.task == 'linux_build' || inputs.task == 'linux_audio_visualization' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            xvfb

      - name: Set up Rust
        if: ${{ inputs.task == 'rust_tests' || inputs.task == 'linux_build' || inputs.task == 'linux_audio_visualization' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        if: ${{ inputs.task == 'flutter_analyze' || inputs.task == 'flutter_tests' || inputs.task == 'linux_build' || inputs.task == 'linux_audio_visualization' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Show Flutter version
        if: ${{ inputs.task == 'flutter_analyze' || inputs.task == 'flutter_tests' || inputs.task == 'linux_build' || inputs.task == 'linux_audio_visualization' }}
        run: flutter --version

      - name: Get Flutter dependencies
        if: ${{ inputs.task == 'flutter_analyze' || inputs.task == 'flutter_tests' || inputs.task == 'linux_build' || inputs.task == 'linux_audio_visualization' }}
        run: flutter pub get

      - name: Get cargokit build tool dependencies
        if: ${{ inputs.task == 'linux_build' || inputs.task == 'linux_audio_visualization' }}
        run: dart pub get
        working-directory: rust_builder/cargokit/build_tool

      - name: Analyze Flutter code
        if: ${{ inputs.task == 'flutter_analyze' }}
        run: flutter analyze

      - name: Run Flutter tests
        if: ${{ inputs.task == 'flutter_tests' }}
        run: flutter test

      - name: Run Rust tests
        if: ${{ inputs.task == 'rust_tests' }}
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build Linux desktop app
        if: ${{ inputs.task == 'linux_build' }}
        run: flutter build linux

      - name: Generate integration audio fixtures
        if: ${{ inputs.task == 'linux_audio_visualization' }}
        run: python3 tool/generate_test_audio_assets.py --output-dir test-assets/generated

      - name: Run Linux audio visualization integration test
        if: ${{ inputs.task == 'linux_audio_visualization' }}
        env:
          GST_AUDIO_FLUTTER_AUDIO_SINK: fakesink
        run: |
          python3 tool/audio_test_server.py --port 8765 --directory test-assets &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          server_ready=0
          for _ in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/generated/long-30s.wav; then
              server_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$server_ready" -ne 1 ]]; then
            echo "Audio test server did not become ready"
            exit 1
          fi
          xvfb-run -a flutter test integration_test/audio_visualization_test.dart -d linux
