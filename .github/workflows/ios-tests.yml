name: iOS Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: Open a tmate SSH session for live debugging
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  GSTREAMER_IOS_VERSION: 1.28.2
  GSTREAMER_IOS_XCFRAMEWORK_SHA256: c2e538da4430c73ac0fdf20db635dc342142cd401cf9e9b00b94dcbb9ccba542
  IOS_SIMULATOR_ARCHS: arm64

jobs:
  ios-tests:
    name: iOS simulator tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          pkg-config --version
          rustc --version
          cargo --version

      - name: Cache GStreamer iOS SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/gstreamer-ios
          key: gstreamer-ios-xcframework-v2-${{ env.GSTREAMER_IOS_VERSION }}-${{ env.GSTREAMER_IOS_XCFRAMEWORK_SHA256 }}

      - name: Install GStreamer iOS SDK
        run: |
          set -euo pipefail

          cache_dir="$HOME/.cache/gstreamer-ios"
          mkdir -p "$cache_dir"

          archive_name="gstreamer-${GSTREAMER_IOS_VERSION}-xcframework.tar.xz"
          archive_path="$cache_dir/$archive_name"
          archive_url="https://gstreamer.freedesktop.org/pkg/ios/${GSTREAMER_IOS_VERSION}/$archive_name"
          extract_dir="$cache_dir/gstreamer-${GSTREAMER_IOS_VERSION}-xcframework"

          needs_extract=0
          if [[ ! -d "$extract_dir/GStreamer.xcframework" ]]; then
            needs_extract=1
          elif [[ ! -f "$extract_dir/GStreamer.xcframework/ios-arm64/libGStreamer.a" ]]; then
            needs_extract=1
          elif ! find "$extract_dir/GStreamer.xcframework" \
              -maxdepth 2 \
              -path '*/ios-*simulator/libGStreamer.a' \
              -print -quit | grep -q .; then
            needs_extract=1
          fi

          if [[ "$needs_extract" -eq 1 ]]; then
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            if [[ ! -f "$archive_path" ]]; then
              curl --fail --location --retry 5 --retry-delay 10 \
                --output "$archive_path" \
                "$archive_url"
            fi
            echo "${GSTREAMER_IOS_XCFRAMEWORK_SHA256}  ${archive_path}" | shasum --algorithm 256 --check -
            df -h "$HOME" || true
            members_file="$RUNNER_TEMP/gstreamer-ios-members.txt"
            tar -tf "$archive_path" \
              | grep -E '^GStreamer\.xcframework/(Info\.plist|ios-arm64/|ios-arm64_x86_64-simulator/|ios-arm64-simulator/|ios-x86_64-simulator/)' \
              > "$members_file"
            if ! grep -q '^GStreamer\.xcframework/ios-arm64/' "$members_file"; then
              echo "GStreamer.xcframework ios-arm64 slice was not found in archive"
              exit 1
            fi
            if ! grep -E '^GStreamer\.xcframework/ios-.*simulator/' "$members_file"; then
              echo "GStreamer.xcframework iOS simulator slice was not found in archive"
              exit 1
            fi
            tar -xJf "$archive_path" -C "$extract_dir"
          else
            echo "${GSTREAMER_IOS_XCFRAMEWORK_SHA256}  ${archive_path}" | shasum --algorithm 256 --check -
          fi

          gstreamer_xcframework="$(find "$extract_dir" -maxdepth 4 -type d -name 'GStreamer.xcframework' -print -quit)"
          if [[ -z "$gstreamer_xcframework" ]]; then
            find "$extract_dir" -maxdepth 4 -print
            exit 1
          fi

          device_library_dir="$gstreamer_xcframework/ios-arm64"
          simulator_library_file="$(
            find "$gstreamer_xcframework" \
              -maxdepth 2 \
              -path '*/ios-*simulator/libGStreamer.a' \
              -print -quit
          )"
          simulator_library_dir="${simulator_library_file%/libGStreamer.a}"
          if [[ ! -f "$device_library_dir/libGStreamer.a" ]]; then
            find "$gstreamer_xcframework" -maxdepth 3 -type f -name 'libGStreamer.a' -print
            exit 1
          fi
          if [[ -z "$simulator_library_dir" || ! -f "$simulator_library_dir/libGStreamer.a" ]]; then
            find "$gstreamer_xcframework" -maxdepth 3 -type f -name 'libGStreamer.a' -print
            exit 1
          fi

          {
            echo "GSTREAMER_IOS_XCFRAMEWORK=$gstreamer_xcframework"
            echo "GSTREAMER_IOS_DEVICE_LIBRARY_DIR=$device_library_dir"
            echo "GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR=$simulator_library_dir"
          } >> "$GITHUB_ENV"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli 4.3.1

      - name: Verify native audio Patrol setup
        run: python3 tool/verify_native_audio_patrol_setup.py

      - name: Generate iOS build configuration
        run: flutter build ios --release --config-only --no-codesign

      - name: Setup tmate session
        id: tmate
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true

      - name: Publish tmate connection details
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TMATE_SSH_COMMAND: ${{ steps.tmate.outputs['ssh-command'] }}
          TMATE_WEB_URL: ${{ steps.tmate.outputs['web-url'] }}
        run: |
          set -euo pipefail
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          connection_dir="$RUNNER_TEMP/tmate-connection"
          mkdir -p "$connection_dir"
          connection_file="$connection_dir/connection.txt"

          {
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "SSH: ${TMATE_SSH_COMMAND}"
            if [[ -n "${TMATE_WEB_URL}" ]]; then
              echo "Web: ${TMATE_WEB_URL}"
            fi
          } | tee "$connection_file"

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch_name" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$pr_number" ]]; then
            comment_body=$'iOS tmate debug session is ready.\n\n```bash\n'
            comment_body+="${TMATE_SSH_COMMAND}"
            comment_body+=$'\n```\n\nRun: '
            comment_body+="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh pr comment "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$comment_body"
          fi

      - name: Run iOS simulator integration tests
        timeout-minutes: 120
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/ios-integration-logs"
          mkdir -p "$log_dir"

          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true

          eval "$(python3 tool/resolve_ios_simulator.py --format shell)"
          simulator_name="$SIMULATOR_NAME"
          simulator_device_name="$SIMULATOR_DEVICE_NAME"
          simulator_device_type="$SIMULATOR_DEVICE_TYPE"
          simulator_runtime="$SIMULATOR_RUNTIME"
          simulator_runtime_name="$SIMULATOR_RUNTIME_NAME"
          simulator_id="$(
            xcrun simctl create \
              "$simulator_name" \
              "$simulator_device_type" \
              "$simulator_runtime"
          )"
          if [[ -z "$simulator_id" ]]; then
            echo "Failed to create iOS simulator"
            exit 1
          fi
          echo "$simulator_id" > "$log_dir/simulator-id.txt"
          echo "$simulator_name" > "$log_dir/simulator-name.txt"
          echo "$simulator_device_name" > "$log_dir/simulator-device-name.txt"
          echo "$simulator_device_type" > "$log_dir/simulator-device-type.txt"
          echo "$simulator_runtime_name" > "$log_dir/simulator-runtime-name.txt"
          echo "$simulator_runtime" > "$log_dir/simulator-runtime.txt"

          xcrun simctl shutdown "$simulator_id" || true
          xcrun simctl erase "$simulator_id"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl list devices "$simulator_id" || true
          open -a Simulator || true
          for _ in {1..30}; do
            if flutter devices | tee "$log_dir/flutter-devices-initial.txt" | grep -q "$simulator_id"; then
              break
            fi
            sleep 2
          done
          flutter devices

          echo "::group::iOS native audio permission tests"
          GSTREAMER_IOS_LIBRARY_DIR="$GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR" \
            xcodebuild test \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Debug \
              -destination "id=${simulator_id}" \
              -only-testing:RunnerTests \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              GSTREAMER_IOS_LIBRARY_DIR="${GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR}" \
              LIBRARY_SEARCH_PATHS="\$(inherited) ${GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR}" \
              OTHER_LDFLAGS="\$(inherited) -L${GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR} -lGStreamer -lresolv -liconv -lsqlite3 -lc++ -framework AVFoundation -framework AssetsLibrary -framework AudioToolbox -framework CoreAudio -framework CoreFoundation -framework CoreMedia -framework CoreVideo -framework Foundation -framework VideoToolbox"
          echo "::endgroup::"

          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl list devices "$simulator_id" || true
          open -a Simulator || true
          for _ in {1..30}; do
            if flutter devices | tee "$log_dir/flutter-devices-before-tests.txt" | grep -q "$simulator_id"; then
              break
            fi
            sleep 2
          done
          flutter devices

          python3 tool/generate_test_audio_assets.py --output-dir test-assets/generated
          python3 tool/audio_test_server.py --port 8765 --directory test-assets &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/tone.wav; then
              break
            fi
            sleep 1
          done

          test_status=0
          terminate_runner() {
            xcrun simctl terminate "$simulator_id" com.example.gstAudioFlutter >/dev/null 2>&1 || true
          }

          run_flutter_test() {
            local label="$1"
            local test_file="$2"
            local log_file="$3"
            local timeout_seconds=1200
            local elapsed=0
            local status=0

            echo "::group::${label}"
            echo "Started ${label} at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            terminate_runner
            set +e
            GSTREAMER_IOS_LIBRARY_DIR="$GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR" \
              flutter test "$test_file" \
                -d "$simulator_name" \
                --reporter expanded \
                > >(tee "$log_file") 2>&1 &
            local flutter_pid="$!"

            while kill -0 "$flutter_pid" 2>/dev/null; do
              if [[ "$elapsed" -ge "$timeout_seconds" ]]; then
                echo "Timed out ${label} after ${timeout_seconds} seconds" | tee -a "$log_file"
                terminate_runner
                pkill -TERM -P "$flutter_pid" >/dev/null 2>&1 || true
                kill -TERM "$flutter_pid" >/dev/null 2>&1 || true
                sleep 5
                pkill -KILL -P "$flutter_pid" >/dev/null 2>&1 || true
                kill -KILL "$flutter_pid" >/dev/null 2>&1 || true
                status=124
                break
              fi
              sleep 5
              elapsed=$((elapsed + 5))
            done

            if [[ "$status" -eq 0 ]]; then
              wait "$flutter_pid"
              status="$?"
            else
              wait "$flutter_pid" >/dev/null 2>&1 || true
            fi
            set -e
            terminate_runner
            echo "Finished ${label} with status ${status} at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "::endgroup::"
            return "$status"
          }

          echo "::group::iOS Patrol native audio simulator test"
          terminate_runner
          set +e
          PATH="$PATH:$HOME/.pub-cache/bin" \
          CI=true \
          PATROL_ANALYTICS_ENABLED=false \
          GSTREAMER_IOS_LIBRARY_DIR="$GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR" \
            patrol --verbose build ios \
              --target patrol_test/native_audio_controls_test.dart \
              --simulator \
              --no-label \
              > >(tee "$log_dir/patrol-native-audio-test.log") 2>&1
          patrol_build_status="$?"
          test_status="$patrol_build_status"

          if [[ "$patrol_build_status" -eq 0 ]]; then
            xctestrun_path="$(
              find "$GITHUB_WORKSPACE/build/ios_integ/Build/Products" \
                -type f \
                -name 'Runner_iphonesimulator*.xctestrun' \
                -print -quit
            )"

            if [[ -z "$xctestrun_path" ]]; then
              echo "Patrol iOS xctestrun file was not found" \
                | tee -a "$log_dir/patrol-native-audio-test.log"
              test_status=1
            else
              echo "Using Patrol xctestrun at $xctestrun_path" \
                | tee -a "$log_dir/patrol-native-audio-test.log"
              xcrun simctl uninstall "$simulator_id" com.example.gstAudioFlutter >/dev/null 2>&1 || true
              xcrun simctl uninstall "$simulator_id" com.example.gstAudioFlutter.RunnerUITests.xctrunner >/dev/null 2>&1 || true

              TEST_RUNNER_PATROL_TEST_PORT=8081 \
              TEST_RUNNER_PATROL_APP_PORT=8082 \
              xcodebuild test-without-building \
                -xctestrun "$xctestrun_path" \
                -only-testing RunnerUITests/RunnerUITests \
                -destination "id=${simulator_id}" \
                -destination-timeout 1 \
                -resultBundlePath "$GITHUB_WORKSPACE/build/ios_results_patrol_native_audio.xcresult" \
                > >(tee -a "$log_dir/patrol-native-audio-test.log") 2>&1
              test_status="$?"
            fi
          fi
          set -e
          terminate_runner
          echo "::endgroup::"

          if [[ "$test_status" -eq 0 ]]; then
            xcrun simctl boot "$simulator_id" || true
            xcrun simctl bootstatus "$simulator_id" -b
            xcrun simctl list devices "$simulator_id" || true
            open -a Simulator || true
            for _ in {1..30}; do
              if flutter devices | tee "$log_dir/flutter-devices-after-patrol.txt" | grep -q "$simulator_id"; then
                break
              fi
              sleep 2
            done
            if ! grep -q "$simulator_id" "$log_dir/flutter-devices-after-patrol.txt"; then
              cat "$log_dir/flutter-devices-after-patrol.txt"
              test_status=1
            fi
          fi

          if [[ "$test_status" -eq 0 ]]; then
            run_flutter_test \
              "iOS playback integration tests" \
              integration_test/ios_playback_test.dart \
              "$log_dir/flutter-test.log" || test_status=$?
          fi

          if [[ "$test_status" -eq 0 ]]; then
            run_flutter_test \
              "iOS HTTP buffer integration tests" \
              integration_test/http_buffer_progress_test.dart \
              "$log_dir/http-buffer-progress-test.log" || test_status=$?
          fi

          if [[ "$test_status" -eq 0 ]]; then
            run_flutter_test \
              "iOS audio visualization integration tests" \
              integration_test/audio_visualization_test.dart \
              "$log_dir/audio-visualization-test.log" || test_status=$?
          fi

          if [[ "$test_status" -eq 0 ]]; then
            run_flutter_test \
              "iOS audio matrix integration tests" \
              integration_test/audio_matrix_test.dart \
              "$log_dir/audio-matrix-test.log" || test_status=$?
          fi

          xcrun simctl spawn "$simulator_id" log show \
            --style syslog \
            --last 10m \
            --predicate 'process == "Runner" OR eventMessage CONTAINS[c] "GStreamer" OR eventMessage CONTAINS[c] "flutter" OR eventMessage CONTAINS[c] "gst_audio"' \
            > "$log_dir/simulator.log" 2>&1 || true

          find "$HOME/Library/Logs/DiagnosticReports" \
            -maxdepth 1 \
            -type f \
            \( -name 'Runner*.crash' -o -name 'Runner*.ips' \) \
            -print \
            -exec cp {} "$log_dir/" \; 2>/dev/null || true

          find build \
            -maxdepth 1 \
            -type d \
            -name 'ios_results*.xcresult' \
            -print \
            -exec cp -R {} "$log_dir/" \; 2>/dev/null || true

          xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true

          exit "$test_status"

      - name: Upload iOS integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-integration-logs
          path: ${{ runner.temp }}/ios-integration-logs
          if-no-files-found: warn
