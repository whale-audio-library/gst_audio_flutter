name: iOS Playback Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-playback-test:
    uses: ./.github/workflows/_ios-workflow.yml
    permissions:
      contents: read
    with:
      task: flutter_test
      test_file: integration_test/ios_playback_test.dart
      artifact_name: ios-playback-test-logs
    secrets: inherit
