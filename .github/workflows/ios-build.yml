name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GSTREAMER_IOS_VERSION: 1.28.2
  GSTREAMER_IOS_SHA256: e85fe53521ff5b5be3cfa6294befa77f21058c259c52dab5ba212e35af469d8b

jobs:
  ios-no-codesign:
    name: iOS release build without signing
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          pkg-config --version
          rustc --version
          cargo --version

      - name: Cache GStreamer iOS SDK package
        uses: actions/cache@v5
        with:
          path: ~/.cache/gstreamer-ios
          key: gstreamer-ios-${{ env.GSTREAMER_IOS_VERSION }}-${{ env.GSTREAMER_IOS_SHA256 }}

      - name: Install GStreamer iOS SDK
        run: |
          set -euo pipefail

          cache_dir="$HOME/.cache/gstreamer-ios"
          mkdir -p "$cache_dir"

          package_name="gstreamer-1.0-devel-${GSTREAMER_IOS_VERSION}-ios-universal.pkg"
          package_path="$cache_dir/$package_name"
          package_url="https://gstreamer.freedesktop.org/pkg/ios/${GSTREAMER_IOS_VERSION}/$package_name"

          if [[ ! -f "$package_path" ]]; then
            curl --fail --location --retry 5 --retry-delay 10 \
              --output "$package_path" \
              "$package_url"
          fi

          echo "${GSTREAMER_IOS_SHA256}  ${package_path}" | shasum --algorithm 256 --check -
          sudo installer -pkg "$package_path" -target /

          gstreamer_prefix="/Library/Frameworks/GStreamer.framework/Versions/1.0"
          pkg_config_dir="$gstreamer_prefix/lib/pkgconfig"
          test -f "$pkg_config_dir/gstreamer-1.0.pc"
          test -f "$pkg_config_dir/glib-2.0.pc"

          {
            echo "GSTREAMER_ROOT_IOS=$gstreamer_prefix"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_PATH=$pkg_config_dir"
            echo "PKG_CONFIG_LIBDIR=$pkg_config_dir"
          } >> "$GITHUB_ENV"

          PKG_CONFIG_ALLOW_CROSS=1 \
          PKG_CONFIG_PATH="$pkg_config_dir" \
          PKG_CONFIG_LIBDIR="$pkg_config_dir" \
            pkg-config --modversion glib-2.0 gstreamer-1.0 gstreamer-audio-1.0

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate iOS build configuration
        run: flutter build ios --release --config-only --no-codesign

      - name: Build iOS without codesign
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
