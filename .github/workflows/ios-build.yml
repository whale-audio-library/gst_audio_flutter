name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GSTREAMER_IOS_VERSION: 1.28.2
  GSTREAMER_IOS_XCFRAMEWORK_SHA256: c2e538da4430c73ac0fdf20db635dc342142cd401cf9e9b00b94dcbb9ccba542

jobs:
  ios-no-codesign:
    name: iOS release build without signing
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          pkg-config --version
          rustc --version
          cargo --version

      - name: Cache GStreamer iOS SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/gstreamer-ios
          key: gstreamer-ios-xcframework-${{ env.GSTREAMER_IOS_VERSION }}-${{ env.GSTREAMER_IOS_XCFRAMEWORK_SHA256 }}

      - name: Install GStreamer iOS SDK
        run: |
          set -euo pipefail

          cache_dir="$HOME/.cache/gstreamer-ios"
          mkdir -p "$cache_dir"

          archive_name="gstreamer-${GSTREAMER_IOS_VERSION}-xcframework.tar.xz"
          archive_path="$cache_dir/$archive_name"
          archive_url="https://gstreamer.freedesktop.org/pkg/ios/${GSTREAMER_IOS_VERSION}/$archive_name"
          extract_dir="$cache_dir/gstreamer-${GSTREAMER_IOS_VERSION}-xcframework"

          if [[ ! -d "$extract_dir/GStreamer.xcframework" ]]; then
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            curl --fail --location --retry 5 --retry-delay 10 \
              --output "$archive_path" \
              "$archive_url"
            echo "${GSTREAMER_IOS_XCFRAMEWORK_SHA256}  ${archive_path}" | shasum --algorithm 256 --check -
            tar -xJf "$archive_path" -C "$extract_dir"
          else
            echo "${GSTREAMER_IOS_XCFRAMEWORK_SHA256}  ${archive_path}" | shasum --algorithm 256 --check -
          fi

          gstreamer_xcframework="$(find "$extract_dir" -maxdepth 4 -type d -name 'GStreamer.xcframework' -print -quit)"
          if [[ -z "$gstreamer_xcframework" ]]; then
            find "$extract_dir" -maxdepth 4 -print
            exit 1
          fi

          ios_framework_path="$(find "$gstreamer_xcframework" -maxdepth 3 -type d -path '*/ios-arm64*/GStreamer.framework' ! -path '*simulator*' -print -quit)"
          if [[ -z "$ios_framework_path" ]]; then
            find "$gstreamer_xcframework" -maxdepth 4 -type d -name 'GStreamer.framework' -print
            exit 1
          fi
          ios_framework_dir="$(dirname "$ios_framework_path")"

          headers_dir="$ios_framework_dir/Headers"
          test -d "$headers_dir"
          include_paths="$headers_dir:$headers_dir/glib-2.0:$headers_dir/gstreamer-1.0:$headers_dir/arm64"

          pkg_config_pc="$(find "$extract_dir" -type f -name 'gstreamer-1.0.pc' -print -quit)"
          pkg_config_dir=""
          if [[ -n "$pkg_config_pc" ]]; then
            pkg_config_dir="$(dirname "$pkg_config_pc")"
          fi
          {
            echo "GSTREAMER_IOS_XCFRAMEWORK=$gstreamer_xcframework"
            echo "GSTREAMER_IOS_FRAMEWORK_DIR=$ios_framework_dir"
          } >> "$GITHUB_ENV"

          if [[ -n "$pkg_config_dir" ]]; then
            {
              echo "PKG_CONFIG_ALLOW_CROSS=1"
              echo "PKG_CONFIG_PATH=$pkg_config_dir"
              echo "PKG_CONFIG_LIBDIR=$pkg_config_dir"
            } >> "$GITHUB_ENV"

            PKG_CONFIG_ALLOW_CROSS=1 \
            PKG_CONFIG_PATH="$pkg_config_dir" \
            PKG_CONFIG_LIBDIR="$pkg_config_dir" \
              pkg-config --modversion glib-2.0 gstreamer-1.0
          else
            for dep in GLIB_2_0 GOBJECT_2_0 GIO_2_0 GSTREAMER_1_0; do
              {
                echo "SYSTEM_DEPS_${dep}_NO_PKG_CONFIG=1"
                echo "SYSTEM_DEPS_${dep}_LIB_FRAMEWORK=GStreamer"
                echo "SYSTEM_DEPS_${dep}_SEARCH_FRAMEWORK=$ios_framework_dir"
                echo "SYSTEM_DEPS_${dep}_INCLUDE=$include_paths"
              } >> "$GITHUB_ENV"
            done
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate iOS build configuration
        run: flutter build ios --release --config-only --no-codesign

      - name: Build iOS without codesign
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            FRAMEWORK_SEARCH_PATHS="\$(inherited) ${GSTREAMER_IOS_FRAMEWORK_DIR}" \
            OTHER_LDFLAGS="\$(inherited) -F${GSTREAMER_IOS_FRAMEWORK_DIR} -framework GStreamer" \
            build
