name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Flutter and Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Get cargokit build tool dependencies
        run: dart pub get
        working-directory: rust_builder/cargokit/build_tool

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build Linux desktop app
        run: flutter build linux

      - name: Generate integration audio fixtures
        run: python3 tool/generate_test_audio_assets.py --output-dir test-assets/generated

      - name: Run Linux audio visualization integration test
        run: |
          python3 tool/audio_test_server.py --port 8765 --directory test-assets &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          server_ready=0
          for _ in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/generated/long-30s.wav; then
              server_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$server_ready" -ne 1 ]]; then
            echo "Audio test server did not become ready"
            exit 1
          fi
          xvfb-run -a flutter test integration_test/audio_visualization_test.dart -d linux
        env:
          GST_AUDIO_FLUTTER_AUDIO_SINK: fakesink

  android-apk:
    name: Android APK build
    runs-on: ubuntu-latest

    env:
      GSTREAMER_VERSION: 1.28.2
      GSTREAMER_SHA256: ba9f1c6e10f0736fbf48cd741634fa90e49d50c961a4454230040b2517490d2a
      GSTREAMER_ROOT_ANDROID: ${{ github.workspace }}/.cache/gstreamer-android/gstreamer-1.0-android-universal-1.28.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            xz-utils

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images
          docker image prune -af || true
          df -h

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Cache GStreamer Android SDK
        id: cache-gstreamer-android
        uses: actions/cache@v5
        with:
          path: .cache/gstreamer-android/gstreamer-1.0-android-universal-${{ env.GSTREAMER_VERSION }}
          key: gstreamer-android-${{ env.GSTREAMER_VERSION }}-${{ env.GSTREAMER_SHA256 }}

      - name: Download GStreamer Android SDK
        if: steps.cache-gstreamer-android.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/gstreamer-android
          cd .cache/gstreamer-android
          curl -fsSLO "https://gstreamer.freedesktop.org/pkg/android/${GSTREAMER_VERSION}/gstreamer-1.0-android-universal-${GSTREAMER_VERSION}.tar.xz"
          echo "${GSTREAMER_SHA256}  gstreamer-1.0-android-universal-${GSTREAMER_VERSION}.tar.xz" | sha256sum -c -
          mkdir -p "gstreamer-1.0-android-universal-${GSTREAMER_VERSION}"
          tar -xJf "gstreamer-1.0-android-universal-${GSTREAMER_VERSION}.tar.xz" \
            -C "gstreamer-1.0-android-universal-${GSTREAMER_VERSION}"
          rm "gstreamer-1.0-android-universal-${GSTREAMER_VERSION}.tar.xz"

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release --target-platform android-x64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gst-audio-flutter-android-x64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
