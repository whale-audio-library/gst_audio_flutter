name: iOS Debug

on:
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: Open a tmate SSH session for live debugging
        required: false
        default: true
        type: boolean
      mode:
        description: Which iOS test flow to run
        required: false
        default: patrol_native_audio
        type: choice
        options:
          - patrol_native_audio
          - ios_playback
          - ios_http_buffer
          - ios_audio_visualization
          - ios_audio_matrix
      flutter_test_target:
        description: Optional custom flutter test target when mode=custom_flutter_test
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  GSTREAMER_IOS_VERSION: 1.28.2
  GSTREAMER_IOS_XCFRAMEWORK_SHA256: c2e538da4430c73ac0fdf20db635dc342142cd401cf9e9b00b94dcbb9ccba542
  IOS_SIMULATOR_ARCHS: arm64

jobs:
  ios-debug:
    name: iOS debug and remote test session
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          rustc --version
          cargo --version

      - name: Cache GStreamer iOS SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/gstreamer-ios
          key: gstreamer-ios-xcframework-v2-${{ env.GSTREAMER_IOS_VERSION }}-${{ env.GSTREAMER_IOS_XCFRAMEWORK_SHA256 }}

      - name: Install GStreamer iOS SDK
        run: |
          set -euo pipefail

          cache_dir="$HOME/.cache/gstreamer-ios"
          mkdir -p "$cache_dir"

          archive_name="gstreamer-${GSTREAMER_IOS_VERSION}-xcframework.tar.xz"
          archive_path="$cache_dir/$archive_name"
          archive_url="https://gstreamer.freedesktop.org/pkg/ios/${GSTREAMER_IOS_VERSION}/$archive_name"
          extract_dir="$cache_dir/gstreamer-${GSTREAMER_IOS_VERSION}-xcframework"

          if [[ ! -d "$extract_dir/GStreamer.xcframework" ]]; then
            if [[ ! -f "$archive_path" ]]; then
              curl --fail --location --retry 5 --retry-delay 10 \
                --output "$archive_path" \
                "$archive_url"
            fi
            echo "${GSTREAMER_IOS_XCFRAMEWORK_SHA256}  ${archive_path}" | shasum --algorithm 256 --check -
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            tar -xJf "$archive_path" -C "$extract_dir"
          fi

          gstreamer_xcframework="$(find "$extract_dir" -maxdepth 4 -type d -name 'GStreamer.xcframework' -print -quit)"
          device_library_dir="$gstreamer_xcframework/ios-arm64"
          simulator_library_file="$(
            find "$gstreamer_xcframework" \
              -maxdepth 2 \
              -path '*/ios-*simulator/libGStreamer.a' \
              -print -quit
          )"
          simulator_library_dir="${simulator_library_file%/libGStreamer.a}"

          {
            echo "GSTREAMER_IOS_XCFRAMEWORK=$gstreamer_xcframework"
            echo "GSTREAMER_IOS_DEVICE_LIBRARY_DIR=$device_library_dir"
            echo "GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR=$simulator_library_dir"
          } >> "$GITHUB_ENV"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli 4.3.1

      - name: Verify native audio Patrol setup
        run: python3 tool/verify_native_audio_patrol_setup.py

      - name: Prepare debug logs and simulator
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/ios-debug-logs"
          mkdir -p "$log_dir"

          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true

          simulator_name="CI Debug iPhone 16 Pro"
          simulator_id="$(
            xcrun simctl create \
              "$simulator_name" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
              com.apple.CoreSimulator.SimRuntime.iOS-18-5
          )"

          {
            echo "IOS_DEBUG_LOG_DIR=$log_dir"
            echo "IOS_DEBUG_SIMULATOR_ID=$simulator_id"
            echo "IOS_DEBUG_SIMULATOR_NAME=$simulator_name"
          } >> "$GITHUB_ENV"

          echo "$simulator_id" > "$log_dir/simulator-id.txt"
          echo "$simulator_name" > "$log_dir/simulator-name.txt"

          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          open -a Simulator || true
          flutter devices | tee "$log_dir/flutter-devices.txt"

          python3 tool/generate_test_audio_assets.py --output-dir test-assets/generated
          python3 tool/audio_test_server.py --port 8765 --directory test-assets &
          server_pid="$!"
          echo "$server_pid" > "$log_dir/audio-server.pid"

      - name: Setup tmate session
        id: tmate
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true

      - name: Publish tmate connection details
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TMATE_SSH_COMMAND: ${{ steps.tmate.outputs['ssh-command'] }}
          TMATE_WEB_URL: ${{ steps.tmate.outputs['web-url'] }}
        run: |
          set -euo pipefail
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          connection_dir="$RUNNER_TEMP/tmate-connection"
          mkdir -p "$connection_dir"
          connection_file="$connection_dir/connection.txt"

          {
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "SSH: ${TMATE_SSH_COMMAND}"
            if [[ -n "${TMATE_WEB_URL}" ]]; then
              echo "Web: ${TMATE_WEB_URL}"
            fi
          } | tee "$connection_file"

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch_name" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$pr_number" ]]; then
            comment_body=$'iOS tmate debug session is ready.\n\n```bash\n'
            comment_body+="${TMATE_SSH_COMMAND}"
            comment_body+=$'\n```\n\nRun: '
            comment_body+="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh pr comment "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$comment_body"
          fi

      - name: Run selected iOS debug test
        run: |
          set -euo pipefail
          log_dir="$IOS_DEBUG_LOG_DIR"
          simulator_id="$IOS_DEBUG_SIMULATOR_ID"
          simulator_name="$IOS_DEBUG_SIMULATOR_NAME"
          mode="${{ github.event.inputs.mode }}"

          run_flutter_test() {
            local target="$1"
            local log_file="$2"
            ARCHS="${IOS_SIMULATOR_ARCHS}" \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            GSTREAMER_IOS_LIBRARY_DIR="$GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR" \
              flutter test "$target" -d "$simulator_name" --reporter expanded \
                > >(tee "$log_file") 2>&1
          }

          case "$mode" in
            patrol_native_audio)
              PATH="$PATH:$HOME/.pub-cache/bin" \
              GSTREAMER_IOS_LIBRARY_DIR="$GSTREAMER_IOS_SIMULATOR_LIBRARY_DIR" \
                patrol --verbose build ios \
                  --target patrol_test/native_audio_controls_test.dart \
                  --simulator \
                  --no-label \
                  > >(tee "$log_dir/patrol-build.log") 2>&1
              xctestrun_path="$(
                find "$GITHUB_WORKSPACE/build/ios_integ/Build/Products" \
                  -type f \
                  -name 'Runner_iphonesimulator*.xctestrun' \
                  -print -quit
              )"
              TEST_RUNNER_PATROL_TEST_PORT=8081 \
              TEST_RUNNER_PATROL_APP_PORT=8082 \
              xcodebuild test-without-building \
                -xctestrun "$xctestrun_path" \
                -only-testing RunnerUITests/RunnerUITests \
                -destination "id=${simulator_id}" \
                -resultBundlePath "$GITHUB_WORKSPACE/build/ios_results_patrol_native_audio_debug.xcresult" \
                > >(tee "$log_dir/patrol-native-audio.log") 2>&1
              ;;
            ios_playback)
              run_flutter_test integration_test/ios_playback_test.dart "$log_dir/ios-playback.log"
              ;;
            ios_http_buffer)
              run_flutter_test integration_test/http_buffer_progress_test.dart "$log_dir/ios-http-buffer.log"
              ;;
            ios_audio_visualization)
              run_flutter_test integration_test/audio_visualization_test.dart "$log_dir/ios-audio-visualization.log"
              ;;
            ios_audio_matrix)
              run_flutter_test integration_test/audio_matrix_test.dart "$log_dir/ios-audio-matrix.log"
              ;;
            *)
              custom_target="${{ github.event.inputs.flutter_test_target }}"
              if [[ -z "$custom_target" ]]; then
                echo "Unsupported mode: $mode"
                exit 1
              fi
              run_flutter_test "$custom_target" "$log_dir/custom-flutter-test.log"
              ;;
          esac

      - name: Upload iOS debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-debug-logs
          path: ${{ env.IOS_DEBUG_LOG_DIR }}
          if-no-files-found: warn

      - name: Cleanup debug simulator
        if: always()
        run: |
          set +e
          if [[ -f "$IOS_DEBUG_LOG_DIR/audio-server.pid" ]]; then
            kill "$(cat "$IOS_DEBUG_LOG_DIR/audio-server.pid")" 2>/dev/null || true
          fi
          xcrun simctl delete "$IOS_DEBUG_SIMULATOR_ID" >/dev/null 2>&1 || true
